<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register — Community Admin</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>🏛️ Create Account</h2>
    <p class="subtitle">Register as a resident or staff member</p>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form method="post" th:action="@{/register}">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="fullName" class="form-control" placeholder="Enter full name" required />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="Choose a password" required />
      </div>
      <div class="form-group">
        <label>Register As</label>
        <select name="role" class="form-control">
          <option value="RESIDENT">Resident</option>
          <option value="STAFF">Staff</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
    <div class="link">
      Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>
  </div>
</div>
</body>
</html>
