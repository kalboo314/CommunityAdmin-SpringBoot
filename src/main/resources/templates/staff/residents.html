<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Residents</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: staff-sidebar}"></div>
<div class="main-content">
    <div class="topbar">
        <h2>Resident Records</h2>
        <span class="topbar-user">👤 <span th:text="${user.fullName}"></span> — Staff</span>
    </div>
    <div class="card">
        <div class="card-header">
            <h3>All Residents</h3>
            <a th:href="@{/staff/residents/add}" class="btn btn-primary">➕ Add Resident</a>
        </div>
        <div class="search-bar">
            <form method="get" th:action="@{/staff/residents}" style="display:flex; gap:8px;">
                <input type="text" name="keyword" class="form-control"
                       placeholder="Search by name or NIK" th:value="${keyword}" />
                <button type="submit" class="btn btn-primary">Search</button>
                <a th:href="@{/staff/residents}" class="btn btn-secondary">Clear</a>
            </form>
        </div>
        <table>
            <thead>
            <tr>
                <th>NIK</th><th>Full Name</th><th>Gender</th>
                <th>Address</th><th>Occupation</th><th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${residents}">
                <td th:text="${r.nik}"></td>
                <td th:text="${r.fullName}"></td>
                <td th:text="${r.gender}"></td>
                <td th:text="${r.address}"></td>
                <td th:text="${r.occupation}"></td>
                <td>
                    <a th:href="@{/staff/residents/edit/{id}(id=${r.id})}" class="btn btn-info">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
