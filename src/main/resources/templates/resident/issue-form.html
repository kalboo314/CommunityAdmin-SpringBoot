<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Report an Issue</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: resident-sidebar}"></div>
<div class="main-content">
  <div class="topbar">
    <h2>Report a Community Issue</h2>
    <span class="topbar-user">👤 <span th:text="${user.fullName}"></span></span>
  </div>
  <div class="card">
    <form method="post" th:action="@{/resident/issues/submit}" enctype="multipart/form-data">
      <div class="form-group">
        <label>Issue Category</label>
        <select name="category" class="form-control">
          <option value="Electricity Problem">Electricity Problem</option>
          <option value="Broken Road">Broken Road</option>
          <option value="Dirty Water / Water Supply">Dirty Water / Water Supply</option>
          <option value="Drainage / Flooding">Drainage / Flooding</option>
          <option value="Street Lighting">Street Lighting</option>
          <option value="Garbage / Sanitation">Garbage / Sanitation</option>
          <option value="Public Safety">Public Safety</option>
          <option value="Environmental">Environmental</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" class="form-control"
               placeholder="Brief title of the issue" required />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" class="form-control" rows="4"
                  placeholder="Describe the issue in detail..." required></textarea>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" name="location" class="form-control"
               placeholder="Where is the issue located?" required />
      </div>
      <div class="form-group">
        <label>Evidence Photo <span style="color:#888; font-size:13px;">(optional)</span></label>
        <input type="file" name="photo" class="form-control" accept="image/*" />
        <small style="color:#888;">Upload a photo as evidence (JPG, PNG, max 5MB)</small>
      </div>
      <div style="display:flex; gap:12px; margin-top:8px;">
        <button type="submit" class="btn btn-danger">Submit Report</button>
        <a th:href="@{/resident/issues}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
