<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Issue Reports</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/sidebar :: resident-sidebar}"></div>
<div class="main-content">
  <div class="topbar">
    <h2>My Issue Reports</h2>
    <span class="topbar-user">👤 <span th:text="${user.fullName}"></span></span>
  </div>
  <div class="alert alert-success" th:if="${param.submitted}">
    ✅ Your report has been submitted successfully!
  </div>
  <div class="card">
    <div class="card-header">
      <h3>Report History</h3>
      <a th:href="@{/resident/issues/new}" class="btn btn-danger">⚠️ New Report</a>
    </div>
    <table>
      <thead>
      <tr>
        <th>ID</th><th>Category</th><th>Title</th><th>Location</th>
        <th>Status</th><th>Evidence</th><th>Submitted</th><th>Resolution</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="issue : ${issues}">
        <td th:text="${issue.id}"></td>
        <td th:text="${issue.category}"></td>
        <td th:text="${issue.title}"></td>
        <td th:text="${issue.location}"></td>
        <td>
          <span class="badge badge-submitted" th:if="${issue.status == 'Reported'}">Reported</span>
          <span class="badge badge-progress" th:if="${issue.status == 'Under Review'}">Under Review</span>
          <span class="badge badge-progress" th:if="${issue.status == 'In Progress'}">In Progress</span>
          <span class="badge badge-approved" th:if="${issue.status == 'Resolved'}">Resolved</span>
        </td>
        <td>
          <div th:if="${issue.photoPath != null}">
            <span style="font-size:11px; color:#888; display:block;">Reported</span>
            <a th:href="@{'/uploads/' + ${issue.photoPath}}" target="_blank">
              <img th:src="@{'/uploads/' + ${issue.photoPath}}"
                   style="width:60px; height:60px; object-fit:cover; border-radius:4px;" />
            </a>
          </div>
          <div th:if="${issue.resolutionPhotoPath != null}" style="margin-top:6px;">
            <span style="font-size:11px; color:#888; display:block;">Response</span>
            <a th:href="@{'/uploads/' + ${issue.resolutionPhotoPath}}" target="_blank">
              <img th:src="@{'/uploads/' + ${issue.resolutionPhotoPath}}"
                   style="width:60px; height:60px; object-fit:cover; border-radius:4px;" />
            </a>
          </div>
          <span th:if="${issue.photoPath == null and issue.resolutionPhotoPath == null}"
                style="color:#aaa; font-size:13px;">—</span>
        </td>
        <td th:text="${#temporals.format(issue.createdAt, 'dd MMM yyyy')}"></td>
        <td>
          <span th:if="${issue.resolutionNotes != null}"
                style="font-size:13px;" th:text="${issue.resolutionNotes}"></span>
          <span th:if="${issue.resolutionNotes == null}"
                style="color:#aaa; font-size:13px;">—</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(issues)}">
        <td colspan="8" style="text-align:center; color:#aaa; padding:24px;">
          No reports yet. <a th:href="@{/resident/issues/new}">Submit your first report.</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
